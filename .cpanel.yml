---
deployment:
    tasks:
        - export DEPLOYPATH=/home/$CPANEL_USER/public_html/godotxt/
        - export REPOPATH=/home/$CPANEL_USER/git/godotxt/
        - /bin/rsync -a --delete ${REPOPATH}static/ ${DEPLOYPATH}
        - /bin/chmod 755 $DEPLOYPATH
        - /bin/find $DEPLOYPATH -type d -exec /bin/chmod 755 '{}' \;
        - /bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 '{}' \;
